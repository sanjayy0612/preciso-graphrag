[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preciso-graphrag"
version = "0.1.0"
description = "Local-first GraphRAG system exposed as an MCP server"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
# Only the importable code: the local MCP package is preciso_mcp so it can
# never shadow the MCP SDK's `mcp` package again.
include = ["core*", "ingest*", "preciso_mcp*"]
